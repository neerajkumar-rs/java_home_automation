<!DOCTYPE html>
<html>
<head>
    <title>Test All Functionalities</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .warning { background: #fff3cd; }
        button { margin: 5px; padding: 5px 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Home Automation System Test</h1>
    
    <div class="test">
        <h2>1. Test Login</h2>
        <button onclick="testLogin('admin', 'admin123')">Test Admin Login</button>
        <button onclick="testLogin('user', 'user123')">Test User Login</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="test">
        <h2>2. Test Get Devices</h2>
        <button onclick="testGetDevices()" id="getDevicesBtn" disabled>Get Devices</button>
        <div id="devicesResult"></div>
    </div>
    
    <div class="test">
        <h2>3. Test Add Device (Add Button)</h2>
        <input type="text" id="deviceName" placeholder="Device Name" value="Test Lamp">
        <select id="deviceType">
            <option value="SWITCH">Switch</option>
            <option value="SLIDER">Slider</option>
            <option value="RGB">RGB Light</option>
            <option value="SENSOR">Sensor</option>
        </select>
        <button onclick="testAddDevice()" id="addDeviceBtn" disabled>Add Device</button>
        <div id="addDeviceResult"></div>
    </div>
    
    <div class="test">
        <h2>4. Test Virtual Devices Script</h2>
        <button onclick="testVirtualDevices()">Test Script Connection</button>
        <div id="virtualDevicesResult"></div>
    </div>
    
    <div class="test">
        <h2>5. Current Token Status</h2>
        <div id="tokenStatus">No active token</div>
        <button onclick="clearToken()">Clear Token</button>
    </div>
    
    <script>
        let currentToken = localStorage.getItem('token');
        updateTokenStatus();
        
        function updateTokenStatus() {
            const token = localStorage.getItem('token');
            const statusDiv = document.getElementById('tokenStatus');
            if (token) {
                statusDiv.innerHTML = `<span class="success">Token active: ${token.substring(0, 30)}...</span>`;
                document.getElementById('getDevicesBtn').disabled = false;
                document.getElementById('addDeviceBtn').disabled = false;
            } else {
                statusDiv.innerHTML = '<span class="warning">No active token</span>';
                document.getElementById('getDevicesBtn').disabled = true;
                document.getElementById('addDeviceBtn').disabled = true;
            }
        }
        
        function clearToken() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            updateTokenStatus();
            document.getElementById('loginResult').innerHTML = '<span class="success">Token cleared</span>';
        }
        
        async function testLogin(username, password) {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = 'Logging in...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    resultDiv.innerHTML = `<span class="success">✅ Login successful! User: ${data.username}, Admin: ${data.admin}</span>`;
                    updateTokenStatus();
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Login failed: ${data.error}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
            }
        }
        
        async function testGetDevices() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('devicesResult').innerHTML = '<span class="error">No token. Please login first.</span>';
                return;
            }
            
            const resultDiv = document.getElementById('devicesResult');
            resultDiv.innerHTML = 'Loading devices...';
            
            try {
                const response = await fetch('/device/s', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const devices = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ Retrieved ${devices.length} devices</span>`;
                    if (devices.length > 0) {
                        resultDiv.innerHTML += `<pre>${JSON.stringify(devices.slice(0, 3), null, 2)}</pre>`;
                    }
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = `<span class="error">❌ Failed to get devices: ${response.status} - ${error}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
            }
        }
        
        async function testAddDevice() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('addDeviceResult').innerHTML = '<span class="error">No token. Please login first.</span>';
                return;
            }
            
            const name = document.getElementById('deviceName').value || 'Test Device';
            const controlType = document.getElementById('deviceType').value;
            const resultDiv = document.getElementById('addDeviceResult');
            resultDiv.innerHTML = 'Adding device...';
            
            try {
                const response = await fetch('/device', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        controlType: controlType,
                        sensorType: controlType === 'SENSOR' ? 'temperature' : null
                    })
                });
                
                if (response.ok) {
                    const device = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ Device added successfully: ${device.name}</span>`;
                    // Refresh devices list
                    setTimeout(testGetDevices, 1000);
                } else {
                    const error = await response.text();
                    resultDiv.innerHTML = `<span class="error">❌ Failed to add device: ${response.status} - ${error}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
            }
        }
        
        async function testVirtualDevices() {
            const resultDiv = document.getElementById('virtualDevicesResult');
            resultDiv.innerHTML = 'Testing virtual devices endpoint...';
            
            try {
                const response = await fetch('/devices');
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ Virtual devices endpoint accessible</span>`;
                } else {
                    resultDiv.innerHTML = `<span class="warning">⚠️ Virtual devices endpoint returned ${response.status}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Cannot connect to virtual devices: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
