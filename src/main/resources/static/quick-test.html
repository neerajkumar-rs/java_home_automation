<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Login Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 10px 0; }
        button { padding: 10px; margin: 5px; }
        .success { color: green; }
        .error { color: red; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Quick Login Test</h1>
    <p>Test credentials after server starts:</p>
    <div class="test">
        <button onclick="testAdmin()">Test admin/admin123</button>
        <button onclick="testUser()">Test user/user123</button>
    </div>
    <div id="result"></div>
    
    <script>
        async function testAdmin() {
            await testLogin('admin', 'admin123');
        }
        
        async function testUser() {
            await testLogin('user', 'user123');
        }
        
        async function testLogin(username, password) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Testing ${username}/${password}...`;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✓ SUCCESS!</strong> Login worked for ${username}<br>
                            Token: ${data.token ? 'Yes' : 'No'}<br>
                            isAdmin: ${data.isAdmin}<br>
                            roles: ${data.roles ? JSON.stringify(data.roles) : 'None'}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <strong>✗ FAILED!</strong> Login failed for ${username}<br>
                            Error: ${data.error || 'Unknown error'}<br>
                            Status: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <strong>Network Error!</strong><br>
                        ${error.message}<br>
                        Check if server is running on port 8081
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
