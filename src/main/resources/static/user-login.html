<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Home Automation</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 15% 10%, #fff9df 0, transparent 30%), var(--paper);
            padding: 20px;
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(59, 66, 55, .08);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }
        
        .login-eyebrow {
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0 0 14px;
            text-transform: uppercase;
        }
        
        .login-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            line-height: 1.1;
            margin: 0 0 10px;
            color: var(--ink);
        }
        
        .login-subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            color: var(--muted);
            font-size: .78rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-input {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: var(--panel);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(214, 106, 67, 0.15);
        }
        
        .form-input::placeholder {
            color: #a0a8a3;
        }
        
        .login-button {
            width: 100%;
            min-height: 52px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 24px;
        }
        
        .login-button:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .login-button:disabled {
            background: var(--muted);
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            background: rgba(214, 106, 67, 0.1);
            color: var(--accent-dark);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: .9rem;
            display: none;
            border-left: 4px solid var(--accent);
        }
        
        .error-message.show {
            display: block;
        }
        
        .login-footer {
            text-align: center;
            color: var(--muted);
            font-size: .9rem;
            margin-top: 24px;
        }
        
        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        .admin-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: .85rem;
        }
        
        .role-toggle {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        
        .role-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            color: var(--muted);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .role-tab:hover {
            background: rgba(214, 106, 67, 0.05);
        }
        
        .role-tab.active {
            background: var(--accent);
            color: white;
        }
        
        .feature-list {
            margin: 30px 0;
            padding: 0;
            list-style: none;
        }
        
        .feature-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            color: var(--ink);
            font-size: .9rem;
        }
        
        .feature-list li::before {
            content: "✓";
            color: var(--on);
            font-weight: bold;
            font-size: 1rem;
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 253, 248, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--accent);
            z-index: 1000;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
            
            .login-wrapper {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-eyebrow">User Portal</div>
                <h1 class="login-title">Home Automation</h1>
                <p class="login-subtitle">Sign in to control your smart devices</p>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" 
                           id="username" 
                           class="form-input" 
                           placeholder="Enter your username"
                           required
                           autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" 
                           id="password" 
                           class="form-input" 
                           placeholder="Enter your password"
                           required
                           autocomplete="current-password">
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    <span id="buttonText">Sign In</span>
                    <span id="loadingSpinner" class="loading-spinner" style="display: none; margin-left: 10px;"></span>
                </button>
            </form>
            
            <div class="feature-list">
                <li>Control lights, switches, and sensors</li>
                <li>Create automation rules</li>
                <li>Monitor energy usage</li>
                <li>Receive smart notifications</li>
            </div>
            
            <div class="login-footer">
                <p>Don't have an account? <a href="register.html" class="footer-link">Register here</a></p>
            </div>
            
            <div class="admin-link">
                <p>Admin user? <a href="/admin.html" class="footer-link">Go to Admin Portal</a></p>
            </div>
        </div>
    </div>
    
    <div id="loadingOverlay" class="loading-overlay">
        <div style="text-align: center;">
            <div class="loading-spinner" style="margin: 0 auto 20px;"></div>
            <p>Authenticating...</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            // Check if already logged in
            const token = localStorage.getItem('jwtToken');
            if (token) {
                // Validate token
                showLoading(true, 'Checking session...');
                
                fetch('/api/auth/validate', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.valid) {
                        const user = JSON.parse(localStorage.getItem('userData') || '{}');
                        if (user && (user.isAdmin || user.roles?.includes('ROLE_ADMIN'))) {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    } else {
                        localStorage.removeItem('jwtToken');
                        localStorage.removeItem('userData');
                        showLoading(false);
                    }
                })
                .catch(error => {
                    console.error('Session check failed:', error);
                    localStorage.removeItem('jwtToken');
                    localStorage.removeItem('userData');
                    showLoading(false);
                });
            }
            
            // Login form submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                
                if (!username || !password) {
                    showError('Please enter both username and password');
                    return;
                }
                
                // Disable form and show loading
                loginButton.disabled = true;
                buttonText.textContent = 'Signing in...';
                loadingSpinner.style.display = 'inline-block';
                showLoading(true, 'Authenticating...');
                hideError();
                
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.token) {
                        // Save token and user data
                        localStorage.setItem('jwtToken', data.token);
                        
                        // Extract user info from token or response
                        const userInfo = {
                            id: data.id || username,
                            username: data.username || username,
                            email: data.email || `${username}@homeautomation.com`,
                            firstName: data.firstName || 'User',
                            lastName: data.lastName || 'User',
                            isAdmin: data.admin || data.roles?.includes('ROLE_ADMIN') || false,
                            roles: data.roles || ['ROLE_USER']
                        };
                        
                        localStorage.setItem('userData', JSON.stringify(userInfo));
                        
                        // Redirect based on role
                        if (userInfo.isAdmin || userInfo.roles.includes('ROLE_ADMIN')) {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    } else {
                        showError(data.error || data.message || 'Login failed. Please check your credentials.');
                        resetLoginButton();
                        showLoading(false);
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('Network error. Please check your connection and try again.');
                    resetLoginButton();
                    showLoading(false);
                }
            });
            
            // Helper functions
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
            }
            
            function hideError() {
                errorMessage.classList.remove('show');
                errorMessage.textContent = '';
            }
            
            function resetLoginButton() {
                loginButton.disabled = false;
                buttonText.textContent = 'Sign In';
                loadingSpinner.style.display = 'none';
            }
            
            function showLoading(show, message) {
                const loadingOverlay = document.getElementById('loadingOverlay');
                if (message && loadingOverlay.querySelector('p')) {
                    loadingOverlay.querySelector('p').textContent = message;
                }
                loadingOverlay.classList.toggle('show', show);
            }
            
            // Auto-focus username field
            document.getElementById('username').focus();
            
            // Add some visual feedback on input focus
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('focused');
                });
            });
        });
    </script>
</body>
</html>
