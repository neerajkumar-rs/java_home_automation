<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Devices - Home Automation</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <span class="topbar-title">My Devices</span>
        <button id="logoutBtn" class="btn small">Log out</button>
    </header>

    <main class="container">
        <p id="alert" class="alert error hidden"></p>

        <section class="card">
            <h2 class="section-title">Add device</h2>
            <form id="addForm" class="row">
                <input type="text" id="newName" placeholder="Name" required>
                <select id="newType">
                    <option value="SWITCH">Switch</option>
                    <option value="SLIDER">Slider</option>
                    <option value="RGB">RGB light</option>
                    <option value="SENSOR">Sensor</option>
                </select>
                <input type="text" id="newRoom" placeholder="Room (optional)">
                <button type="submit" class="btn primary">Add</button>
            </form>
        </section>

        <section id="devices" class="grid"></section>
        <p id="emptyMsg" class="muted center hidden">No devices yet. Add one above.</p>

        <section class="card">
            <h2 class="section-title">Recent activity</h2>
            <ul id="logs" class="log-list"></ul>
            <p id="logsEmpty" class="muted hidden">No state changes yet.</p>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const alertEl = document.getElementById('alert');
        const devicesEl = document.getElementById('devices');
        const logsEl = document.getElementById('logs');
        let devices = [];

        document.getElementById('logoutBtn').addEventListener('click', logout);

        function showError(msg) {
            alertEl.textContent = msg;
            alertEl.classList.remove('hidden');
        }
        function clearError() { alertEl.classList.add('hidden'); }

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        async function loadDevices() {
            const res = await apiFetch('/api/devices');
            if (!res.ok) { showError(await apiErrorMessage(res, 'Could not load devices')); return; }
            devices = await res.json();
            renderDevices();
            loadLogs();
        }

        function renderDevices() {
            devicesEl.replaceChildren();
            document.getElementById('emptyMsg').classList.toggle('hidden', devices.length > 0);
            devices.forEach(d => devicesEl.appendChild(renderDevice(d)));
        }

        function renderDevice(d) {
            const card = el('div', 'card device-card');

            const head = el('div', 'row space-between');
            head.appendChild(el('strong', null, d.name));
            head.appendChild(el('span', 'badge ' + (d.state === 'ON' ? 'on' : 'off'), d.state));
            card.appendChild(head);

            card.appendChild(el('p', 'muted', (d.type || '') + (d.room ? ' · ' + d.room : '')));

            const controls = el('div', 'controls');

            const toggleBtn = el('button', 'btn small', d.state === 'ON' ? 'Turn off' : 'Turn on');
            toggleBtn.addEventListener('click', () => setState(d, d.state === 'ON' ? 'OFF' : 'ON'));
            controls.appendChild(toggleBtn);

            if (d.type === 'SLIDER' || d.type === 'RGB') {
                const slider = el('input');
                slider.type = 'range'; slider.min = 0; slider.max = 100; slider.value = d.value;
                slider.addEventListener('change', () => setState(d, d.state, Number(slider.value)));
                controls.appendChild(slider);
            }

            if (d.type === 'RGB') {
                const color = el('input');
                color.type = 'color';
                color.value = rgbToHex(d.red, d.green, d.blue);
                color.addEventListener('change', () => setColor(d, color.value));
                controls.appendChild(color);
            }

            const delBtn = el('button', 'btn small danger', 'Delete');
            delBtn.addEventListener('click', () => removeDevice(d));
            controls.appendChild(delBtn);

            card.appendChild(controls);
            return card;
        }

        function rgbToHex(r, g, b) {
            const h = n => Number(n).toString(16).padStart(2, '0');
            return '#' + h(r) + h(g) + h(b);
        }

        async function setState(d, state, value) {
            clearError();
            const body = { state };
            if (value !== undefined) body.value = value;
            const res = await apiFetch('/api/devices/' + d.id + '/state', { method: 'POST', body: JSON.stringify(body) });
            if (!res.ok) { showError(await apiErrorMessage(res, 'State change failed')); return; }
            loadDevices();
        }

        async function setColor(d, hex) {
            clearError();
            const body = {
                red: parseInt(hex.slice(1, 3), 16),
                green: parseInt(hex.slice(3, 5), 16),
                blue: parseInt(hex.slice(5, 7), 16)
            };
            const res = await apiFetch('/api/devices/' + d.id + '/color', { method: 'POST', body: JSON.stringify(body) });
            if (!res.ok) { showError(await apiErrorMessage(res, 'Color change failed')); return; }
            loadDevices();
        }

        async function removeDevice(d) {
            if (!confirm('Delete "' + d.name + '"?')) return;
            clearError();
            const res = await apiFetch('/api/devices/' + d.id, { method: 'DELETE' });
            if (!res.ok) { showError(await apiErrorMessage(res, 'Delete failed')); return; }
            loadDevices();
        }

        async function loadLogs() {
            logsEl.replaceChildren();
            if (devices.length === 0) { document.getElementById('logsEmpty').classList.remove('hidden'); return; }
            const res = await apiFetch('/api/devices/' + devices[0].id + '/logs');
            if (!res.ok) { return; }
            const logs = await res.json();
            document.getElementById('logsEmpty').classList.toggle('hidden', logs.length > 0);
            logs.slice(0, 10).forEach(l => {
                const item = el('li', null,
                    (l.previousState ?? '?') + ' → ' + l.newState +
                    (l.newValue ? ' (' + l.previousValue + ' → ' + l.newValue + ')' : '') +
                    ' · ' + (l.triggeredBy ?? '') + ' · ' + (l.changeReason ?? ''));
                logsEl.appendChild(item);
            });
        }

        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const body = {
                name: document.getElementById('newName').value.trim(),
                type: document.getElementById('newType').value,
                room: document.getElementById('newRoom').value.trim() || null
            };
            const res = await apiFetch('/api/devices', { method: 'POST', body: JSON.stringify(body) });
            if (!res.ok) { showError(await apiErrorMessage(res, 'Could not add device')); return; }
            document.getElementById('newName').value = '';
            document.getElementById('newRoom').value = '';
            loadDevices();
        });

        if (requireAuth()) loadDevices();
    </script>
</body>
</html>
