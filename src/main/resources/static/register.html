<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Home Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <style>
        .register-card { max-width: 520px; }
        .form-row { display: flex; gap: 16px; }
        .form-col { flex: 1; min-width: 0; }
        @media (max-width: 520px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <main class="auth-card register-card">
            <div class="auth-inner">
                <h1 class="auth-title"><span class="prompt">&gt;</span> create account</h1>
                <p class="auth-sub">// join the home automation grid</p>

                <div id="errorMessage" class="error-box hidden" role="alert"></div>
                <div id="successMessage" class="success-box hidden" role="status"></div>

                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label for="firstName">First Name *</label>
                                <input type="text" id="firstName" class="form-input" placeholder="John" required>
                                <div class="form-error" id="firstNameError"></div>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label for="lastName">Last Name *</label>
                                <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
                                <div class="form-error" id="lastNameError"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" class="form-input" placeholder="johndoe" required>
                        <div class="form-hint">3-50 characters</div>
                        <div class="form-error" id="usernameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                        <div class="form-error" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter password" required>
                        <div class="form-hint">6-120 characters</div>
                        <div class="form-error" id="passwordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm password" required>
                        <div class="form-error" id="confirmPasswordError"></div>
                    </div>

                    <div class="check-row">
                        <input type="checkbox" id="isAdmin">
                        <label for="isAdmin">Register as Administrator</label>
                    </div>

                    <button type="submit" class="btn primary full" id="registerButton">
                        <span id="buttonText">Create Account</span>
                        <span id="loadingSpinner" class="spinner" style="display:none;margin-left:8px;"></span>
                    </button>
                </form>

                <p class="auth-foot">Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </main>
    </div>

    <script>
        // Form validation
        function validateForm() {
            let isValid = true;

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Reset all errors
            document.querySelectorAll('.form-error').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });

            document.querySelectorAll('.form-input').forEach(el => {
                el.classList.remove('invalid', 'valid');
            });

            // Validate first name
            if (!firstName.trim()) {
                document.getElementById('firstNameError').textContent = 'First name is required';
                document.getElementById('firstNameError').classList.add('show');
                document.getElementById('firstName').classList.add('invalid');
                isValid = false;
            } else if (firstName.length > 50) {
                document.getElementById('firstNameError').textContent = 'First name must be less than 50 characters';
                document.getElementById('firstNameError').classList.add('show');
                document.getElementById('firstName').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('firstName').classList.add('valid');
            }

            // Validate last name
            if (!lastName.trim()) {
                document.getElementById('lastNameError').textContent = 'Last name is required';
                document.getElementById('lastNameError').classList.add('show');
                document.getElementById('lastName').classList.add('invalid');
                isValid = false;
            } else if (lastName.length > 50) {
                document.getElementById('lastNameError').textContent = 'Last name must be less than 50 characters';
                document.getElementById('lastNameError').classList.add('show');
                document.getElementById('lastName').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('lastName').classList.add('valid');
            }

            // Validate username
            if (!username.trim()) {
                document.getElementById('usernameError').textContent = 'Username is required';
                document.getElementById('usernameError').classList.add('show');
                document.getElementById('username').classList.add('invalid');
                isValid = false;
            } else if (username.length < 3 || username.length > 50) {
                document.getElementById('usernameError').textContent = 'Username must be between 3 and 50 characters';
                document.getElementById('usernameError').classList.add('show');
                document.getElementById('username').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('username').classList.add('valid');
            }

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.trim()) {
                document.getElementById('emailError').textContent = 'Email is required';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else if (email.length > 100) {
                document.getElementById('emailError').textContent = 'Email must be less than 100 characters';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('email').classList.add('valid');
            }

            // Validate password
            if (!password.trim()) {
                document.getElementById('passwordError').textContent = 'Password is required';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('invalid');
                isValid = false;
            } else if (password.length < 6 || password.length > 120) {
                document.getElementById('passwordError').textContent = 'Password must be between 6 and 120 characters';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('password').classList.add('valid');
            }

            // Validate confirm password
            if (!confirmPassword.trim()) {
                document.getElementById('confirmPasswordError').textContent = 'Please confirm your password';
                document.getElementById('confirmPasswordError').classList.add('show');
                document.getElementById('confirmPassword').classList.add('invalid');
                isValid = false;
            } else if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                document.getElementById('confirmPasswordError').classList.add('show');
                document.getElementById('confirmPassword').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('confirmPassword').classList.add('valid');
            }

            return isValid;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const isAdmin = document.getElementById('isAdmin').checked;

            const button = document.getElementById('registerButton');
            const buttonText = document.getElementById('buttonText');
            const spinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Clear previous messages
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            errorMessage.textContent = '';
            successMessage.textContent = '';

            // Show loading state
            button.disabled = true;
            buttonText.textContent = 'Creating account...';
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        firstName,
                        lastName,
                        password,
                        admin: isAdmin
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success message
                    successMessage.textContent = '> account created. redirecting to sign in...';
                    successMessage.classList.remove('hidden');

                    // Clear form
                    document.getElementById('registerForm').reset();

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    // Show error
                    errorMessage.textContent = '> error: ' + (data.error || data.message || 'Registration failed. Please try again.');
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                errorMessage.textContent = '> error: network failure. check your connection.';
                errorMessage.classList.remove('hidden');
            } finally {
                // Reset button state
                button.disabled = false;
                buttonText.textContent = 'Create Account';
                spinner.style.display = 'none';
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('token');
        if (token) {
            // Validate token
            fetch('/api/auth/validate', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.valid) {
                    // Redirect based on user role
                    const user = JSON.parse(localStorage.getItem('user'));
                    if (user && user.isAdmin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } else {
                    // Clear invalid token
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            })
            .catch(() => {
                // Clear invalid token on error
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            });
        }

        // Real-time validation
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('blur', validateForm);
        });
    </script>
</body>
</html>
