<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Home Automation</title>
    <link rel="stylesheet" href="/styles.css?v=register-1">
    <style>
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        .register-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .register-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .register-header p {
            color: #7f8c8d;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
        }
        
        .form-col {
            flex: 1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: bold;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .form-input.invalid {
            border-color: #e74c3c;
        }
        
        .form-input.valid {
            border-color: #27ae60;
        }
        
        .form-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .form-error {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 5px;
            display: none;
        }
        
        .form-error.show {
            display: block;
        }
        
        .btn-register {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-register:hover {
            background-color: #219653;
        }
        
        .btn-register:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        
        .error-message {
            background-color: #ffeaea;
            color: #c0392b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background-color: #e8f6e8;
            color: #27ae60;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }
        
        .login-link a {
            color: #3498db;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .admin-checkbox {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .admin-checkbox label {
            cursor: pointer;
            color: #2c3e50;
            font-weight: normal;
        }
        
        .admin-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h1>Create Account</h1>
                <p>Join Home Automation System</p>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" class="form-input" placeholder="John" required>
                            <div class="form-error" id="firstNameError"></div>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
                            <div class="form-error" id="lastNameError"></div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" class="form-input" placeholder="johndoe" required>
                    <div class="form-hint">3-50 characters</div>
                    <div class="form-error" id="usernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" required>
                    <div class="form-hint">6-120 characters</div>
                    <div class="form-error" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm password" required>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>
                
                <div class="admin-checkbox">
                    <input type="checkbox" id="isAdmin">
                    <label for="isAdmin">Register as Administrator</label>
                </div>
                
                <button type="submit" class="btn-register" id="registerButton">
                    <span id="buttonText">Create Account</span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </button>
            </form>
            
            <div class="login-link">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>
    
    <script>
        // Form validation
        function validateForm() {
            let isValid = true;
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Reset all errors
            document.querySelectorAll('.form-error').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            
            document.querySelectorAll('.form-input').forEach(el => {
                el.classList.remove('invalid', 'valid');
            });
            
            // Validate first name
            if (!firstName.trim()) {
                document.getElementById('firstNameError').textContent = 'First name is required';
                document.getElementById('firstNameError').classList.add('show');
                document.getElementById('firstName').classList.add('invalid');
                isValid = false;
            } else if (firstName.length > 50) {
                document.getElementById('firstNameError').textContent = 'First name must be less than 50 characters';
                document.getElementById('firstNameError').classList.add('show');
                document.getElementById('firstName').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('firstName').classList.add('valid');
            }
            
            // Validate last name
            if (!lastName.trim()) {
                document.getElementById('lastNameError').textContent = 'Last name is required';
                document.getElementById('lastNameError').classList.add('show');
                document.getElementById('lastName').classList.add('invalid');
                isValid = false;
            } else if (lastName.length > 50) {
                document.getElementById('lastNameError').textContent = 'Last name must be less than 50 characters';
                document.getElementById('lastNameError').classList.add('show');
                document.getElementById('lastName').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('lastName').classList.add('valid');
            }
            
            // Validate username
            if (!username.trim()) {
                document.getElementById('usernameError').textContent = 'Username is required';
                document.getElementById('usernameError').classList.add('show');
                document.getElementById('username').classList.add('invalid');
                isValid = false;
            } else if (username.length < 3 || username.length > 50) {
                document.getElementById('usernameError').textContent = 'Username must be between 3 and 50 characters';
                document.getElementById('usernameError').classList.add('show');
                document.getElementById('username').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('username').classList.add('valid');
            }
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email.trim()) {
                document.getElementById('emailError').textContent = 'Email is required';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else if (email.length > 100) {
                document.getElementById('emailError').textContent = 'Email must be less than 100 characters';
                document.getElementById('emailError').classList.add('show');
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('email').classList.add('valid');
            }
            
            // Validate password
            if (!password.trim()) {
                document.getElementById('passwordError').textContent = 'Password is required';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('invalid');
                isValid = false;
            } else if (password.length < 6 || password.length > 120) {
                document.getElementById('passwordError').textContent = 'Password must be between 6 and 120 characters';
                document.getElementById('passwordError').classList.add('show');
                document.getElementById('password').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('password').classList.add('valid');
            }
            
            // Validate confirm password
            if (!confirmPassword.trim()) {
                document.getElementById('confirmPasswordError').textContent = 'Please confirm your password';
                document.getElementById('confirmPasswordError').classList.add('show');
                document.getElementById('confirmPassword').classList.add('invalid');
                isValid = false;
            } else if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                document.getElementById('confirmPasswordError').classList.add('show');
                document.getElementById('confirmPassword').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('confirmPassword').classList.add('valid');
            }
            
            return isValid;
        }
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const isAdmin = document.getElementById('isAdmin').checked;
            
            const button = document.getElementById('registerButton');
            const buttonText = document.getElementById('buttonText');
            const spinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Clear previous messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            errorMessage.textContent = '';
            successMessage.textContent = '';
            
            // Show loading state
            button.disabled = true;
            buttonText.textContent = 'Creating account...';
            spinner.style.display = 'inline-block';
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username, 
                        email, 
                        firstName, 
                        lastName, 
                        password,
                        admin: isAdmin 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show success message
                    successMessage.textContent = 'Account created successfully! Redirecting to login...';
                    successMessage.classList.add('show');
                    
                    // Clear form
                    document.getElementById('registerForm').reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    // Show error
                    errorMessage.textContent = data.error || 'Registration failed. Please try again.';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = 'Network error. Please check your connection.';
                errorMessage.classList.add('show');
            } finally {
                // Reset button state
                button.disabled = false;
                buttonText.textContent = 'Create Account';
                spinner.style.display = 'none';
            }
        });
        
        // Check if already logged in
        const token = localStorage.getItem('token');
        if (token) {
            // Validate token
            fetch('/api/auth/validate', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.valid) {
                    // Redirect based on user role
                    const user = JSON.parse(localStorage.getItem('user'));
                    if (user && user.isAdmin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } else {
                    // Clear invalid token
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            })
            .catch(() => {
                // Clear invalid token on error
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            });
        }
        
        // Real-time validation
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('blur', validateForm);
        });
    </script>
</body>
</html>
