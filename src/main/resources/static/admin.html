<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Home Automation</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <span class="topbar-title">Admin Console</span>
        <button id="logoutBtn" class="btn small">Log out</button>
    </header>

    <main class="container">
        <p id="alert" class="alert error hidden"></p>

        <section class="card">
            <h2 class="section-title">Users</h2>
            <table>
                <thead>
                    <tr><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr>
                </thead>
                <tbody id="usersBody"></tbody>
            </table>
        </section>

        <section class="card">
            <h2 class="section-title">All devices</h2>
            <table>
                <thead>
                    <tr><th>Name</th><th>Type</th><th>State</th><th>Owner</th><th>Room</th></tr>
                </thead>
                <tbody id="devicesBody"></tbody>
            </table>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const alertEl = document.getElementById('alert');
        document.getElementById('logoutBtn').addEventListener('click', logout);

        function showError(msg) {
            alertEl.textContent = msg;
            alertEl.classList.remove('hidden');
        }

        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        async function guard() {
            const res = await apiFetch('/api/auth/me');
            if (!res.ok) { window.location.href = '/login.html'; return false; }
            const me = await res.json();
            if (!me.isAdmin) { window.location.href = '/dashboard.html'; return false; }
            return true;
        }

        async function loadUsers() {
            const res = await apiFetch('/api/admin/users');
            if (!res.ok) { showError(await apiErrorMessage(res, 'Could not load users')); return; }
            const users = await res.json();
            const body = document.getElementById('usersBody');
            body.replaceChildren();
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.appendChild(el('td', null, u.username));
                tr.appendChild(el('td', null, u.email));
                tr.appendChild(el('td', null, u.role));
                tr.appendChild(el('td', null, u.active ? 'Yes' : 'No'));
                const actionTd = document.createElement('td');
                const btn = el('button', 'btn small', u.active ? 'Disable' : 'Enable');
                btn.addEventListener('click', () => toggleUser(u));
                actionTd.appendChild(btn);
                tr.appendChild(actionTd);
                body.appendChild(tr);
            });
        }

        async function toggleUser(u) {
            const action = u.active ? 'deactivate' : 'activate';
            const res = await apiFetch('/api/admin/users/' + u.id + '/' + action, { method: 'POST' });
            if (!res.ok) { showError(await apiErrorMessage(res, 'Could not update user')); return; }
            loadUsers();
        }

        async function loadDevices() {
            const res = await apiFetch('/api/admin/devices');
            if (!res.ok) { showError(await apiErrorMessage(res, 'Could not load devices')); return; }
            const devices = await res.json();
            const body = document.getElementById('devicesBody');
            body.replaceChildren();
            devices.forEach(d => {
                const tr = document.createElement('tr');
                tr.appendChild(el('td', null, d.name));
                tr.appendChild(el('td', null, d.type));
                tr.appendChild(el('td', null, d.state));
                tr.appendChild(el('td', null, d.ownerEmail));
                tr.appendChild(el('td', null, d.room || ''));
                body.appendChild(tr);
            });
        }

        (async () => {
            if (!requireAuth()) return;
            if (await guard()) {
                loadUsers();
                loadDevices();
            }
        })();
    </script>
</body>
</html>
