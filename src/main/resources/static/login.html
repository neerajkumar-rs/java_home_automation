<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Home Automation</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="center-page">
    <main class="card auth-card">
        <h1 class="card-title">Home Automation</h1>
        <p class="card-subtitle">Sign in to control your devices</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <p id="error" class="alert error hidden"></p>
            <button type="submit" id="loginBtn" class="btn primary full">Sign in</button>
        </form>

        <p class="muted center">No account? <a href="/register.html">Register</a></p>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const btn = document.getElementById('loginBtn');

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                if (!res.ok) {
                    showError(await apiErrorMessage(res, 'Login failed'));
                    return;
                }
                const data = await res.json();
                localStorage.setItem('token', data.token);

                // Role comes from the server, not the login response alone.
                const me = await apiFetch('/api/auth/me');
                if (!me.ok) {
                    showError(await apiErrorMessage(me, 'Could not load profile'));
                    return;
                }
                const meData = await me.json();
                window.location.href = meData.isAdmin ? '/admin.html' : '/dashboard.html';
            } catch (err) {
                showError('Network error. Is the server running?');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
