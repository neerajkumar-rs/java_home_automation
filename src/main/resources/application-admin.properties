# Admin Portal Configuration
spring.application.name=home-automation-admin

# Admin Portal runs on port 8081
server.port=8081

# JWT Configuration

server.error.include-message=always
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=src/main/resources/drop.sql

# Database Configuration
spring.datasource.url=jdbc:sqlite:home_automation.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.springframework.security=DEBUG

# JWT Configuration (same as user for compatibility)

# Security logging (more verbose for admin)
logging.level.org.springframework.security=TRACE
logging.level.com.example.homeautomation.security=DEBUG

# Admin Portal Welcome Message
portal.title=Admin Portal
portal.description=System administration and management console

# Enable admin-only features
features.admin=true
features.user-management=true
features.system-config=true

# Performance monitoring
management.endpoints.web.exposure.include=health,metrics,info
