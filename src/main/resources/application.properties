spring.application.name=home-automation

# JWT: secret MUST come from the JWT_SECRET environment variable (32+ bytes).
# Startup fails fast with a clear message when it is missing or too short.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

spring.datasource.url=jdbc:sqlite:./data/home_automation.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=${PORT:8080}
server.error.include-message=always

# SQLite allows only ONE concurrent writer (even in WAL mode), so a larger pool
# just queues up writers and surfaces SQLITE_BUSY errors instead of helping.
# Keep the pool at 1 so all access is serialized through a single connection.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

