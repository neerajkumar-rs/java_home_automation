# User Portal Configuration
spring.application.name=home-automation-user

# User Portal runs on port 8080
server.port=8080

# JWT Configuration
app.jwt.secret=home-automation-secret-key-that-should-be-at-least-32-characters-long
app.jwt.expiration=86400000

server.error.include-message=always
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=src/main/resources/drop.sql

# Database Configuration
spring.datasource.url=jdbc:sqlite:home_automation.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.springframework.security=DEBUG

# JWT Configuration
app.jwt.secret=home-automation-secret-key-that-should-be-at-least-32-characters-long
app.jwt.expiration=86400000

# Security logging
logging.level.org.springframework.security=DEBUG

# User Portal Welcome Message
portal.title=User Portal
portal.description=Smart home control for regular users